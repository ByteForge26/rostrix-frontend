on:
  push:
    branches:
      - "**"
permissions:
  contents: write
jobs:
  release:
    runs-on:  [self-hosted, decathlon]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Install Dependencies
        run: npm install --save-dev semantic-release @semantic-release/changelog @semantic-release/github @semantic-release/npm @semantic-release/git --legacy-peer-deps
      - name: Run Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_TOKEN }}
          DEBUG: semantic-release:*
